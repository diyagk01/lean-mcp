[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-tool-router"
version = "0.1.0"
description = "Retrieval-based MCP tool routing + compact LLM tool context assembly (no tool execution, no LLM calls)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "lean-mcp contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
embeddings = ["sentence-transformers>=2.6.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
