[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-mcp"
version = "0.1.0"
description = "RAG-first MCP tool routing SDK to reduce token and reasoning cost."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "rag-mcp contributors" }]
dependencies = []

[project.scripts]
lean-mcp-chat = "rag_mcp.chat_cli:main"

[project.optional-dependencies]
fastembed = ["fastembed>=0.3.6"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
